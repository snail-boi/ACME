name: CI
on: 
  push: 
    branches: [main] 
  pull_request: 

permissions: 
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: code ophalen
        uses: actions/checkout@v7
        
      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: run tests
        run: npm test
          



