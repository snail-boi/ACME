name: CI
on: 
  push: 
    branches: [main] 
  pull_request: 

permissions: 
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [22,24,26]
    steps:
      - name: code ophalen
        uses: actions/checkout@v7
        
      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}

      - name: run tests
        run: npm test
          



